name: tokens

on:
  schedule:
    - cron: "15 3 * * 1"         # Mondays 03:15 UTC
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh tokens
        env:
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python -m src.refresh_tokens

      # Needs the REPO_PAT secret (fine-grained PAT, Secrets read+write, this repo only).
      # No PAT? Delete this step and paste the new tokens by hand every ~8 weeks.
      - name: Store the rotated tokens back into Secrets
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          set -a; source new_tokens.txt; set +a
          gh secret set PINTEREST_ACCESS_TOKEN  --body "$PINTEREST_ACCESS_TOKEN"  --repo "$GITHUB_REPOSITORY"
          gh secret set PINTEREST_REFRESH_TOKEN --body "$PINTEREST_REFRESH_TOKEN" --repo "$GITHUB_REPOSITORY"
          rm -f new_tokens.txt
