name: scan

on:
  schedule:
    - cron: "41 16 * * *"        # runs BEFORE plan, so new uploads are plannable today
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan Drive
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
        run: python -m src.scan
      - name: Export CSV mirror
        run: |
          mkdir -p data/export
          python - <<'PY'
          import csv, sqlite3
          con = sqlite3.connect("data/state.db")
          for t in ("content", "jobs"):
              cur = con.execute(f"SELECT * FROM {t}")
              cols = [d[0] for d in cur.description]
              rows = cur.fetchall()
              with open(f"data/export/{t}.csv", "w", newline="", encoding="utf-8") as fh:
                  w = csv.writer(fh); w.writerow(cols); w.writerows(rows)
          print("exported")
          PY
      - name: Save the ledger
        if: always()
        run: |
          git config user.name  "content-network-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ config/
          if git diff --staged --quiet; then
            echo "no ledger changes"
          else
            git commit -m "state: scan ${GITHUB_RUN_ID}"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break || sleep 10
            done
          fi
